<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recepción - DF Comitán</title>

<style>
*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}

/* LOGIN */
#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
}

.loginBox{
  width:380px;
  max-width:90%;
  background:#222;
  padding:35px;
  border-radius:15px;
  box-shadow:0 0 25px rgba(0,0,0,.5);
  text-align:center;
}

.loginBox h1{
  color:gold;
  margin:0 0 10px;
}

.loginBox p{
  color:#aaa;
  margin-bottom:25px;
  line-height:1.5;
}

.loginBox input{
  width:100%;
  font-size:20px;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  outline:none;
}

.loginBox input:focus{
  box-shadow:0 0 0 2px gold;
}

.loginBox button{
  width:100%;
  margin-top:15px;
  padding:14px;
  font-size:20px;
  font-weight:bold;
  border:none;
  border-radius:8px;
  background:gold;
  color:#111;
  cursor:pointer;
}

.loginBox button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#errorLogin{
  color:#ff5555;
  margin-top:15px;
  min-height:20px;
  line-height:1.4;
}

/* APP */
#app{
  display:none;
  min-height:100vh;
}

header{
  position:relative;
  padding:20px;
  text-align:center;
  background:#181818;
  border-bottom:2px solid #333;
}

header h1{
  margin:0;
  color:gold;
  font-size:34px;
}

#conexion{
  margin-top:8px;
  font-size:15px;
  font-weight:bold;
}

.conectado{color:#00d26a;}
.desconectado{color:#ff4444;}

#usuarioActual{
  position:absolute;
  right:20px;
  top:18px;
  color:#777;
  font-size:13px;
}

#btnCerrarSesion{
  position:absolute;
  right:20px;
  top:40px;
  padding:5px 9px;
  border:none;
  border-radius:5px;
  background:#800;
  color:white;
  font-size:12px;
  cursor:pointer;
}

/* FILAS */
.contenedorFilas{
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:25px;
  padding:35px 25px;
  max-width:1100px;
  margin:auto;
}

.fila{
  flex:1;
  max-width:500px;
  border-radius:18px;
  padding:30px;
  text-align:center;
}

/* REFRENDO */
.refrendo{
  background:#3b2d08;
  border:3px solid #d6ad25;
  box-shadow:0 0 20px rgba(214,173,37,.18);
}

.refrendo h2{color:#ffd84a;}

/* VEHICULAR */
.vehicular{
  background:#073f3a;
  border:3px solid #54d6c7;
  box-shadow:0 0 20px rgba(84,214,199,.18);
}

.vehicular h2{color:#69e5d6;}

/* TURNO */
.etiqueta{
  font-size:16px;
  color:#aaa;
  margin-top:30px;
}

.numero{
  font-size:100px;
  font-weight:bold;
  margin:8px 0 25px;
}

.numeroRefrendo{color:#ffd84a;}
.numeroVehicular{color:#69e5d6;}

/* BOTONES */
.btnEntregar{
  width:100%;
  padding:20px 10px;
  margin-top:5px;
  font-size:25px;
  font-weight:bold;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:.15s ease;
}

.btnRefrendo{
  background:#d6ad25;
  color:#111;
}

.btnVehicular{
  background:#54d6c7;
  color:#08201e;
}

.btnEntregar:hover{
  filter:brightness(1.1);
  transform:scale(1.02);
}

.btnEntregar:active{
  transform:scale(.98);
}

.btnEntregar:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

/* DESHACER */
.btnDeshacer{
  display:block;
  margin:12px auto 0;
  padding:7px 14px;
  font-size:14px;
  border:none;
  border-radius:6px;
  background:#555;
  color:white;
  cursor:pointer;
}

.btnDeshacer:hover{background:#777;}

.btnDeshacer:disabled{
  opacity:.3;
  cursor:not-allowed;
}

.estadoFila{
  margin-top:15px;
  min-height:20px;
  color:#aaa;
  font-size:14px;
}

#mensajeGeneral{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #555;
  color:white;
  padding:12px 22px;
  border-radius:8px;
  display:none;
  z-index:100;
  box-shadow:0 4px 15px rgba(0,0,0,.5);
}

/* CELULAR */
@media(max-width:800px){

  header{
    padding:18px 15px;
  }

  header h1{
    font-size:26px;
  }

  #usuarioActual,
  #btnCerrarSesion{
    position:static;
    display:block;
    margin:7px auto 0;
  }

  .contenedorFilas{
    flex-direction:column;
    padding:20px 15px;
    gap:20px;
  }

  .fila{
    width:100%;
    max-width:none;
    padding:25px 20px;
  }

  .numero{
    font-size:85px;
  }

  .btnEntregar{
    font-size:23px;
    padding:20px 8px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>RECEPCIÓN</h1>

    <p>
      Entrega de turnos<br>
      Delegación de Finanzas Comitán
    </p>

    <form id="loginForm" autocomplete="on">

      <input
        type="email"
        id="loginEmail"
        placeholder="Correo"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        required
      >

      <input
        type="password"
        id="loginPass"
        placeholder="Contraseña"

        required
      >

        id="btnLogin"

        INGRESAR
      </button>

    </form>

    <div id="errorLogin"></div>

  </div>

</div>


<!-- APLICACIÓN -->

<div id="app">

<header>

  <h1>RECEPCIÓN — ENTREGA DE TURNOS</h1>

  <div id="conexion" class="desconectado">
    🔴 SIN CONEXIÓN
  </div>

  <div id="usuarioActual"></div>

  <button
    id="btnCerrarSesion"
    onclick="cerrarSesion()"
  >
    Cerrar sesión
  </button>

</header>


<div class="contenedorFilas">

  <!-- REFRENDO -->

  <section class="fila refrendo">

    <h2>REFRENDO – DERECHOS</h2>

    <div class="etiqueta">
      SIGUIENTE TURNO
    </div>

    <div
      id="turnoRefrendo"
      class="numero numeroRefrendo"
    >
      001
    </div>

    <button
      id="btnRefrendo"
      class="btnEntregar btnRefrendo"
      onclick="entregarRefrendo()"
    >
      ENTREGAR TURNO 001
    </button>

    <button
      id="deshacerRefrendo"
      class="btnDeshacer"
      onclick="deshacerRefrendo()"
      disabled

    </button>

    <div
      id="estadoRefrendo"
      class="estadoFila"
    >
      Listo para entregar

  </section>


  <!-- VEHICULAR -->

  <section class="fila vehicular">

    <h2>TRÁMITE VEHICULAR</h2>

    <div class="etiqueta">
      SIGUIENTE TURNO
    </div>

    <div
      id="turnoVehicular"
      class="numero numeroVehicular"
    >
      V-01
    </div>

    <button
      id="btnVehicular"
      class="btnEntregar btnVehicular"
      onclick="entregarVehicular()"
    >
      ENTREGAR TURNO V-01
    </button>

    <button
      id="deshacerVehicular"
      class="btnDeshacer"
      onclick="deshacerVehicular()"
      disabled
    >
      ↩ Deshacer último
    </button>

    <div
      id="estadoVehicular"

    >
      Listo para entregar

  </section>

</div>

</div>


<div id="mensajeGeneral"></div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

/* =====================================================
   FIREBASE
===================================================== */

firebase.initializeApp({

  apiKey:
    "AIzaSyCajWtx-MaN_yHgUbLPh55uwWLqOeC8KEQ",

  authDomain:
    "sistema-turnos-1204d.firebaseapp.com",

  databaseURL:
    "https://sistema-turnos-1204d-default-rtdb.firebaseio.com",

  projectId:
    "sistema-turnos-1204d",

  storageBucket:
    "sistema-turnos-1204d.firebasestorage.app",

  messagingSenderId:
    "219775892402",

  appId:
    "1:219775892402:web:c1d888a0de5cfc4e3a02ab"

});


const db = firebase.database();
const auth = firebase.auth();


/* =====================================================
   RUTA SIMULADOR
===================================================== */

const RUTA =
  "delegaciones/comitan/comitan_simulador";

const refRefrendo =
  db.ref(RUTA + "/refrendo");

const refVehicular =
  db.ref(RUTA + "/vehicular");


/* =====================================================
   VARIABLES
===================================================== */

let siguienteRefrendo = 1;
let siguienteVehicular = 1;

let ultimoRefrendo = null;
let ultimoVehicular = null;

let listenersInstalados = false;


/* =====================================================
   CONEXIÓN
===================================================== */

db.ref(".info/connected").on("value", snap => {

  const elemento =
    document.getElementById("conexion");

  if(snap.val() === true){

    elemento.innerText =
      "🟢 CONECTADO — SIMULADOR";

    elemento.className =
      "conectado";

  }else{

    elemento.innerText =
      "🔴 SIN CONEXIÓN";

    elemento.className =
      "desconectado";

  }

});


/* =====================================================
   LOGIN
===================================================== */

document
  .getElementById("loginForm")
  .addEventListener("submit", function(e){

    e.preventDefault();

    iniciarSesion();

  });


function iniciarSesion(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("loginPass")
      .value;

  const error =
    document.getElementById("errorLogin");

  const boton =
    document.getElementById("btnLogin");


  error.innerText = "";


  if(!email || !password){

    error.innerText =
      "Ingrese correo y contraseña.";

    return;

  }


  boton.disabled = true;
  boton.innerText = "VERIFICANDO...";


  /*
   * IMPORTANTE:
   * No ocultamos el login aquí.
   *
   * Esperamos a que Firebase confirme
   * el estado mediante onAuthStateChanged.
   */

  auth
    .signInWithEmailAndPassword(
      email,
      password
    )

    .then(() => {

      boton.innerText =
        "INGRESANDO...";

    })

    .catch(err => {

      console.error(
        "ERROR DE AUTENTICACIÓN:",
        err
      );

      boton.disabled = false;
      boton.innerText = "INGRESAR";

      let mensaje =
        "No se pudo iniciar sesión.";

      if(err.code === "auth/wrong-password"){
        mensaje =
          "Correo o contraseña incorrectos.";
      }

      else if(err.code === "auth/user-not-found"){
        mensaje =
          "Correo o contraseña incorrectos.";
      }

      else if(err.code === "auth/invalid-email"){
        mensaje =
          "El correo no es válido.";
      }

      else if(err.code === "auth/network-request-failed"){
        mensaje =
          "No hay conexión a Internet.";
      }

      else if(err.message){
        mensaje =
          err.message;
      }

      error.innerText = mensaje;

    });

}


/* =====================================================
   ESTADO AUTENTICACIÓN
===================================================== */

auth.onAuthStateChanged(user => {

  console.log(
    "ESTADO AUTH:",
    user ? user.email : "SIN USUARIO"
  );


  if(user){

    mostrarAplicacion(user);

  }else{

    mostrarLogin();

  }

});


/* =====================================================
   MOSTRAR LOGIN
===================================================== */

function mostrarLogin(){

  document
    .getElementById("loginScreen")
    .style.display = "flex";

  document
    .getElementById("app")
    .style.display = "none";


  const boton =
    document.getElementById("btnLogin");

  boton.disabled = false;
  boton.innerText = "INGRESAR";

}


/* =====================================================
   MOSTRAR APLICACIÓN
===================================================== */

function mostrarAplicacion(user){

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("app")
    .style.display = "block";


  document
    .getElementById("usuarioActual")
    .innerText =
      user.email;


  cargarEstado();

}


/* =====================================================
   CARGAR ESTADO
===================================================== */

function cargarEstado(){

  /*
   * REFRENDO
   */

  refRefrendo
    .once("value")
    .then(snap => {

      const data =
        snap.val() || {};

      siguienteRefrendo =
        data.siguiente || 1;

      ultimoRefrendo =
        data.ultimo || null;

      actualizarRefrendo();

    })
    .catch(err => {

      console.error(err);

      document
        .getElementById("estadoRefrendo")
        .innerText =
          "Error de lectura";

    });


  /*
   * VEHICULAR
   */

  refVehicular
    .once("value")
    .then(snap => {

      const data =
        snap.val() || {};

      siguienteVehicular =
        data.siguiente || 1;

      ultimoVehicular =
        data.ultimo || null;

      actualizarVehicular();

    })
    .catch(err => {

      console.error(err);

      document
        .getElementById("estadoVehicular")
        .innerText =
          "Error de lectura";

    });


  /*
   * LISTENERS
   */

  if(listenersInstalados){
    return;
  }

  listenersInstalados = true;


  refRefrendo.on("value", snap => {

    const data =
      snap.val() || {};

    siguienteRefrendo =
      data.siguiente || 1;

    ultimoRefrendo =
      data.ultimo || null;

    actualizarRefrendo();

  });


  refVehicular.on("value", snap => {

    const data =
      snap.val() || {};

    siguienteVehicular =
      data.siguiente || 1;

    ultimoVehicular =
      data.ultimo || null;

    actualizarVehicular();

  });

}


/* =====================================================
   ACTUALIZAR REFRENDO
===================================================== */

function actualizarRefrendo(){

  const numero =
    String(siguienteRefrendo)
      .padStart(3,"0");


  document
    .getElementById("turnoRefrendo")
    .innerText =
      numero;


  document
    .getElementById("btnRefrendo")
    .innerText =
      "ENTREGAR TURNO " + numero;


  document
    .getElementById("deshacerRefrendo")
    .disabled =
      !ultimoRefrendo;

}


/* =====================================================
   ACTUALIZAR VEHICULAR
===================================================== */

function actualizarVehicular(){

  const numero =
    "V-" +
    String(siguienteVehicular)
      .padStart(2,"0");


  document
    .getElementById("turnoVehicular")
    .innerText =
      numero;


  document
    .getElementById("btnVehicular")
    .innerText =
      "ENTREGAR TURNO " + numero;


  document
    .getElementById("deshacerVehicular")
    .disabled =
      !ultimoVehicular;

}


/* =====================================================
   ENTREGAR REFRENDO
===================================================== */

function entregarRefrendo(){

  if(!auth.currentUser){

    mostrarMensaje(
      "Sesión no válida."
    );

    return;

  }


  const boton =
    document.getElementById("btnRefrendo");

  boton.disabled = true;


  const numero =
    String(siguienteRefrendo)
      .padStart(3,"0");

  const timestamp =
    Date.now();


  const entrega = {

    numero:numero,

    servicio:
      "REFRENDO_DERECHOS",

    timestamp:timestamp,

    usuario:
      auth.currentUser.email

  };


  refRefrendo
    .transaction(data => {

      data =
        data || {};

      const siguiente =
        data.siguiente || 1;


      if(
        siguiente !== siguienteRefrendo
      ){

        return;

      }


      data.entregados =
        (data.entregados || 0) + 1;

      data.siguiente =
        siguiente + 1;


      data.ultimo = {

        numero:numero,

        timestamp:timestamp,

        usuario:
          auth.currentUser.email

      };


      if(!data.historial){
        data.historial = {};
      }


      data.historial[
        "t_" + timestamp
      ] = entrega;


      return data;

    })

    .then(result => {

      boton.disabled = false;


      if(result.committed){

        document
          .getElementById("estadoRefrendo")
          .innerText =
            "Turno " +
            numero +
            " entregado ✓";

        mostrarMensaje(
          "Turno " +
          numero +
          " entregado."
        );

      }else{

        mostrarMensaje(
          "El turno cambió. Actualizando..."
        );

      }

    })

    .catch(err => {

      console.error(
        "ERROR ENTREGANDO REFRENDO:",
        err
      );

      boton.disabled = false;

      mostrarMensaje(
        "⚠ Error al entregar turno."
      );

    });

}


/* =====================================================
   ENTREGAR VEHICULAR
===================================================== */

function entregarVehicular(){

  if(!auth.currentUser){

    mostrarMensaje(
      "Sesión no válida."
    );

    return;

  }


  const boton =
    document.getElementById("btnVehicular");

  boton.disabled = true;


  const numero =
    "V-" +
    String(siguienteVehicular)
      .padStart(2,"0");

  const timestamp =
    Date.now();


  const entrega = {

    numero:numero,

    servicio:
      "VEHICULAR",

    timestamp:timestamp,

    usuario:
      auth.currentUser.email

  };


  refVehicular
    .transaction(data => {

      data =
        data || {};

      const siguiente =
        data.siguiente || 1;


      if(
        siguiente !== siguienteVehicular
      ){

        return;

      }


      data.entregados =
        (data.entregados || 0) + 1;

      data.siguiente =
        siguiente + 1;


      data.ultimo = {

        numero:numero,

        timestamp:timestamp,

        usuario:
          auth.currentUser.email

      };


      if(!data.historial){
        data.historial = {};
      }


      data.historial[
        "t_" + timestamp
      ] = entrega;


      return data;

    })

    .then(result => {

      boton.disabled = false;


      if(result.committed){

        document
          .getElementById("estadoVehicular")
          .innerText =
            "Turno " +
            numero +
            " entregado ✓";

        mostrarMensaje(
          "Turno " +
          numero +
          " entregado."
        );

      }else{

        mostrarMensaje(
          "El turno cambió. Actualizando..."
        );

      }

    })

    .catch(err => {

      console.error(
        "ERROR ENTREGANDO VEHICULAR:",
        err
      );

      boton.disabled = false;

      mostrarMensaje(
        "⚠ Error al entregar turno."
      );

    });

}


/* =====================================================
   DESHACER REFRENDO
===================================================== */

function deshacerRefrendo(){

  if(!ultimoRefrendo){
    return;
  }


  const numero =
    ultimoRefrendo.numero;


  if(!confirm(
    "¿Deshacer la entrega del turno " +
    numero +
    "?"
  )){
    return;
  }


  refRefrendo
    .transaction(data => {

      if(!data){
        return;
      }


      if(
        !data.ultimo ||
        data.ultimo.numero !== numero
      ){
        return;
      }


      if(data.siguiente <= 1){
        return;
      }


      data.siguiente =
        data.siguiente - 1;


      data.entregados =
        Math.max(
          0,
          (data.entregados || 0) - 1
        );


      const historial =
        data.historial || {};

      const keys =
        Object.keys(historial);

      keys.sort();


      if(keys.length > 0){

        delete historial[
          keys[keys.length - 1]
        ];

      }


      const nuevasKeys =
        Object.keys(historial);

      nuevasKeys.sort();


      if(nuevasKeys.length > 0){

        const anterior =
          historial[
            nuevasKeys[
              nuevasKeys.length - 1
            ]
          ];


        data.ultimo = {

          numero:
            anterior.numero,

          timestamp:
            anterior.timestamp,

          usuario:
            anterior.usuario

        };

      }else{

        data.ultimo = null;

      }


      data.historial =
        historial;


      return data;

    })

    .then(result => {

      if(result.committed){

        document
          .getElementById("estadoRefrendo")
          .innerText =
            "Último turno deshecho";

        mostrarMensaje(
          "Turno " +
          numero +
          " deshecho."
        );

      }else{

        mostrarMensaje(
          "No se pudo deshacer. El turno ya cambió."
        );

      }

    })

    .catch(err => {

      console.error(err);

      mostrarMensaje(
        "⚠ Error al deshacer."
      );

    });

}


/* =====================================================
   DESHACER VEHICULAR
===================================================== */

function deshacerVehicular(){

  if(!ultimoVehicular){
    return;
  }


  const numero =
    ultimoVehicular.numero;


  if(!confirm(
    "¿Deshacer la entrega del turno " +
    numero +
    "?"
  )){
    return;
  }


  refVehicular
    .transaction(data => {

      if(!data){
        return;
      }


      if(
        !data.ultimo ||
        data.ultimo.numero !== numero
      ){
        return;
      }


      if(data.siguiente <= 1){
        return;
      }


      data.siguiente =
        data.siguiente - 1;


      data.entregados =
        Math.max(
          0,
          (data.entregados || 0) - 1
        );


      const historial =
        data.historial || {};

      const keys =
        Object.keys(historial);

      keys.sort();


      if(keys.length > 0){

        delete historial[
          keys[keys.length - 1]
        ];

      }


      const nuevasKeys =
        Object.keys(historial);

      nuevasKeys.sort();


      if(nuevasKeys.length > 0){

        const anterior =
          historial[
            nuevasKeys[
              nuevasKeys.length - 1
            ]
          ];


        data.ultimo = {

          numero:
            anterior.numero,

          timestamp:
            anterior.timestamp,

          usuario:
            anterior.usuario

        };

      }else{

        data.ultimo = null;

      }


      data.historial =
        historial;


      return data;

    })

    .then(result => {

      if(result.committed){

        document
          .getElementById("estadoVehicular")
          .innerText =
            "Último turno deshecho";

        mostrarMensaje(
          "Turno " +
          numero +
          " deshecho."
        );

      }else{

        mostrarMensaje(
          "No se pudo deshacer. El turno ya cambió."
        );

      }

    })

    .catch(err => {

      console.error(err);

      mostrarMensaje(
        "⚠ Error al deshacer."
      );

    });

}


/* =====================================================
   MENSAJE
===================================================== */

function mostrarMensaje(texto){

  const elemento =
    document.getElementById(
      "mensajeGeneral"
    );


  elemento.innerText =
    texto;

  elemento.style.display =
    "block";


  setTimeout(() => {

    elemento.style.display =
      "none";

  },2500);

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

function cerrarSesion(){

  auth
    .signOut()
    .then(() => {

      document
        .getElementById("loginPass")
        .value = "";

      document
        .getElementById("errorLogin")
        .innerText = "";

    })
    .catch(err => {

      console.error(
        "ERROR CERRANDO SESIÓN:",
        err
      );

    });

}
